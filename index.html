    <script>
      // Early protection against browser extension noise (MetaMask, Ethereum, Solana injectors)
      (function() {
        function shouldIgnore(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return str.indexOf('metamask') !== -1 ||
                 str.indexOf('ethereum') !== -1 ||
                 str.indexOf('failed to connect to metamask') !== -1 ||
                 str.indexOf('chrome-extension://') !== -1 ||
                 str.indexOf('moz-extension://') !== -1 ||
                 str.indexOf('solana') !== -1 ||
                 str.indexOf('evm') !== -1;
        }
        window.addEventListener('error', function(e) {
          if (shouldIgnore(e.message) || shouldIgnore(e.filename) || (e.error && shouldIgnore(e.error.message))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = typeof reason === 'string' ? reason : (reason && (reason.message || reason.stack)) || '';
          if (shouldIgnore(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <!--
    SIE Frontend Foundation & Core UX Implementation v0.1: `<body>` no
    longer hardcodes the legacy prototype's dark theme (bg-[#09090B]/
    text-slate-100) — that was leaking a dark background at the document
    level underneath BOTH apps (visible during overscroll, before
    hydration, etc.), which fights the new SIE app's light theme and is
    exactly the "dark futuristic AI-dashboard styling" this milestone
    removes. The legacy prototype is unaffected: its own root element
    (src/App.tsx) already sets this same background on itself.
  -->
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
