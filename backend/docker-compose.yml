services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sie}
      POSTGRES_DB: ${POSTGRES_DB:-sie}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sie_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sie} -d ${POSTGRES_DB:-sie}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      POSTGRES_USER: ${POSTGRES_USER:-sie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sie}
      POSTGRES_DB: ${POSTGRES_DB:-sie}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  sie_postgres_data:
